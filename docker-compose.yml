version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: brandguard_postgres
    restart: always
    environment:
      POSTGRES_USER: brandguard_admin
      POSTGRES_PASSWORD: brandguard_secure_password_123
      POSTGRES_DB: brandguard_db
    ports:
      - "5432:5432"
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard_admin -d brandguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brandguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
